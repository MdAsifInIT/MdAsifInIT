<svg width="1200" height="320" viewBox="0 0 1200 320" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title description">
  <title id="title">Md Asif — AI Developer</title>
  <desc id="description">A minimal command-center profile banner highlighting automation, integrations, and developer tooling.</desc>

  <defs>
    <linearGradient id="background" x1="40" y1="24" x2="1160" y2="296" gradientUnits="userSpaceOnUse">
      <stop stop-color="#070B14"/>
      <stop offset="1" stop-color="#0B1324"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#2563EB"/>
      <stop offset="1" stop-color="#60A5FA"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" stroke="#1E293B" stroke-width="1" opacity="0.24"/>
    </pattern>
    <clipPath id="frame">
      <rect width="1200" height="320" rx="16"/>
    </clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1200" height="320" fill="url(#background)"/>
    <rect width="1200" height="320" fill="url(#grid)"/>
    <rect width="5" height="320" fill="url(#accent)"/>

    <g transform="translate(72 68)">
      <text x="0" y="69" fill="#F8FAFC" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="66" font-weight="750" letter-spacing="-2">Md Asif</text>
      <text x="2" y="112" fill="#60A5FA" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="16" font-weight="600" letter-spacing="2.4">AI DEVELOPER</text>
      <text x="2" y="157" fill="#94A3B8" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="18" font-weight="400">Automation systems · Integration layers · Developer tooling</text>
      <rect x="2" y="180" width="92" height="3" rx="1.5" fill="url(#accent)"/>
    </g>

    <g transform="translate(760 54)">
      <rect width="368" height="212" rx="12" fill="#0B1220" stroke="#263247"/>
      <rect x="1" y="1" width="366" height="38" rx="11" fill="#101827"/>
      <path d="M1 39H367" stroke="#263247"/>
      <circle cx="22" cy="20" r="4" fill="#60A5FA"/>
      <text x="36" y="25" fill="#CBD5E1" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="12" font-weight="600" letter-spacing="1.4">PROFILE / SYSTEM</text>

      <text x="22" y="74" fill="#64748B" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="11" letter-spacing="1.3">FOCUS</text>
      <text x="142" y="74" fill="#E2E8F0" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="12">AI AUTOMATION</text>
      <path d="M22 91H346" stroke="#1E293B"/>

      <text x="22" y="116" fill="#64748B" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="11" letter-spacing="1.3">LOCATION</text>
      <text x="142" y="116" fill="#E2E8F0" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="12">BENGALURU, IN</text>
      <path d="M22 133H346" stroke="#1E293B"/>

      <text x="22" y="158" fill="#64748B" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="11" letter-spacing="1.3">MODE</text>
      <text x="142" y="158" fill="#E2E8F0" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="12">BUILD · SHIP · HAND OFF</text>

      <circle cx="24" cy="188" r="5" fill="#3B82F6"/>
      <circle cx="24" cy="188" r="10" stroke="#3B82F6" stroke-opacity="0.28"/>
      <text x="43" y="193" fill="#94A3B8" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="11" letter-spacing="1">SYSTEMS ONLINE</text>
    </g>

    <path d="M712 52V268" stroke="#1E293B" stroke-dasharray="3 7"/>
  </g>

  <rect x="1" y="1" width="1198" height="318" rx="15" stroke="#263247" stroke-width="2"/>
</svg>
