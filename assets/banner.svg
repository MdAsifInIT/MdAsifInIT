<svg width="1200" height="280" viewBox="0 0 1200 280" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="banner-title banner-desc">
  <title id="banner-title">Md Asif — AI Automation Engineer</title>
  <desc id="banner-desc">Profile banner: dark precision grid with static system architecture diagram and identity text.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="280" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#070C19"/>
      <stop offset="1" stop-color="#0B1120"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <mask id="rightMask">
      <linearGradient id="maskGrad" x1="560" y1="0" x2="1200" y2="0" gradientUnits="userSpaceOnUse">
        <stop offset="0" stop-color="white" stop-opacity="0"/>
        <stop offset="0.3" stop-color="white" stop-opacity="1"/>
        <stop offset="1" stop-color="white" stop-opacity="1"/>
      </linearGradient>
      <rect width="1200" height="280" fill="url(#maskGrad)"/>
    </mask>
    <clipPath id="bannerClip">
      <rect width="1200" height="280" rx="16"/>
    </clipPath>
  </defs>

  <g clip-path="url(#bannerClip)">
    <!-- Background -->
    <rect width="1200" height="280" fill="url(#bg)"/>

    <!-- Precise grid (blueprint style) -->
    <g opacity="0.05" stroke="#3B82F6" stroke-width="1">
      <pattern id="gridPattern" width="40" height="40" patternUnits="userSpaceOnUse">
        <rect width="40" height="40" fill="none"/>
        <path d="M 40 0 L 0 0 0 40"/>
      </pattern>
      <rect width="1200" height="280" fill="url(#gridPattern)"/>
    </g>

    <!-- Right panel: Static Architecture DAG -->
    <g mask="url(#rightMask)">
      
      <!-- Right-angle connector paths -->
      <g stroke="#3B82F6" stroke-width="1.5" stroke-opacity="0.3" fill="none">
        <path d="M680,80 L720,80 L720,120 L760,120" />
        <path d="M760,120 L800,120 L800,80 L840,80" />
        <path d="M840,80 L880,80 L880,140 L920,140" />
        <path d="M920,140 L1020,140" />
        <path d="M1020,140 L1060,140 L1060,90 L1100,90" />
        
        <path d="M680,190 L740,190 L740,150 L780,150" />
        <path d="M780,150 L840,150 L840,210 L900,210" />
        <path d="M900,210 L960,210 L960,160 L1020,160" />
        <path d="M1020,160 L1050,160 L1050,220 L1100,220" />

        <!-- Cross connections -->
        <path d="M760,120 L760,150" stroke-dasharray="2 4" />
        <path d="M840,80 L840,150" stroke-dasharray="2 4" />
        <path d="M920,140 L920,210" stroke-dasharray="2 4" />
      </g>

      <!-- Rectangular Nodes -->
      <g font-family="'Courier New', Consolas, monospace" font-size="10" font-weight="bold" text-anchor="middle" fill="#93C5FD">
        <!-- Node 1: Trigger -->
        <rect x="640" y="70" width="40" height="20" rx="3" fill="#1E3A8A" stroke="#3B82F6" stroke-width="1"/>
        <text x="660" y="84">TRIG</text>
        
        <!-- Node 2: Pipeline -->
        <rect x="760" y="110" width="56" height="20" rx="3" fill="#1E3A8A" stroke="#3B82F6" stroke-width="1"/>
        <text x="788" y="124">PIPELINE</text>
        
        <!-- Node 3: Filter -->
        <rect x="840" y="70" width="48" height="20" rx="3" fill="#0B1120" stroke="#3B82F6" stroke-width="1" stroke-dasharray="2 2"/>
        <text x="864" y="84">FILTER</text>

        <!-- Node 4: Transform (Primary focus) -->
        <rect x="920" y="130" width="80" height="24" rx="4" fill="#3B82F6" filter="url(#glow)"/>
        <text x="960" y="146" fill="#070C19">TRANSFORM</text>
        <!-- Static halo ring for primary node -->
        <rect x="914" y="124" width="92" height="36" rx="6" fill="none" stroke="#3B82F6" stroke-width="1" stroke-opacity="0.4"/>

        <!-- Node 5: State -->
        <rect x="640" y="180" width="40" height="20" rx="3" fill="#1E3A8A" stroke="#3B82F6" stroke-width="1"/>
        <text x="660" y="194">SYNC</text>

        <!-- Node 6: Validate -->
        <rect x="780" y="140" width="60" height="20" rx="3" fill="#1E3A8A" stroke="#3B82F6" stroke-width="1"/>
        <text x="810" y="154">VALIDATE</text>
        
        <!-- Node 7: Batch -->
        <rect x="900" y="200" width="48" height="20" rx="3" fill="#0B1120" stroke="#3B82F6" stroke-width="1" stroke-dasharray="2 2"/>
        <text x="924" y="214">BATCH</text>

        <!-- Node 8: Deploy -->
        <rect x="1100" y="80" width="48" height="20" rx="3" fill="#1E3A8A" stroke="#3B82F6" stroke-width="1"/>
        <text x="1124" y="94">DEPLOY</text>
        
        <!-- Node 9: Log -->
        <rect x="1100" y="210" width="40" height="20" rx="3" fill="#0B1120" stroke="#64748B" stroke-width="1"/>
        <text x="1120" y="224" fill="#64748B">LOG</text>
      </g>
    </g>

    <!-- Left side: Identity text block -->
    <!-- Eyebrow tag -->
    <rect x="56" y="62" width="180" height="22" rx="4" fill="#3B82F6" fill-opacity="0.1" stroke="#3B82F6" stroke-opacity="0.35" stroke-width="1"/>
    <text x="68" y="77" fill="#3B82F6" font-family="'Courier New', Consolas, monospace" font-size="11" font-weight="600" letter-spacing="2.5">STAFF ENG. / AI SYS</text>

    <!-- Main name -->
    <text x="56" y="148" fill="#F1F5F9" font-family="Arial, Helvetica, sans-serif" font-size="72" font-weight="800" letter-spacing="-1">Md Asif</text>

    <!-- Subtitle line -->
    <text x="58" y="176" fill="#94A3B8" font-family="'Courier New', Consolas, monospace" font-size="14" letter-spacing="0.5">AI automation · workflow systems · Azure</text>

    <!-- Horizontal rule -->
    <line x1="56" y1="196" x2="560" y2="196" stroke="#1E293B" stroke-width="2"/>

    <!-- Bottom stat chips -->
    <g font-family="'Courier New', Consolas, monospace" font-size="11" fill="#93C5FD">
      <!-- Python -->
      <rect x="56" y="210" width="72" height="20" rx="4" fill="#3B82F6" fill-opacity="0.06" stroke="#3B82F6" stroke-opacity="0.2" stroke-width="1"/>
      <text x="70" y="224">Python</text>
      <!-- PowerShell -->
      <rect x="136" y="210" width="84" height="20" rx="4" fill="#3B82F6" fill-opacity="0.06" stroke="#3B82F6" stroke-opacity="0.2" stroke-width="1"/>
      <text x="149" y="224">PowerShell</text>
      <!-- TypeScript -->
      <rect x="228" y="210" width="84" height="20" rx="4" fill="#3B82F6" fill-opacity="0.06" stroke="#3B82F6" stroke-opacity="0.2" stroke-width="1"/>
      <text x="241" y="224">TypeScript</text>
      <!-- Azure AI -->
      <rect x="320" y="210" width="70" height="20" rx="4" fill="#3B82F6" fill-opacity="0.06" stroke="#3B82F6" stroke-opacity="0.2" stroke-width="1"/>
      <text x="333" y="224">Azure AI</text>
    </g>

    <!-- Outer Border -->
    <rect x="1" y="1" width="1198" height="278" rx="15" stroke="#1E293B" stroke-width="2" fill="none"/>

    <!-- Corner accents (static) -->
    <g stroke="#3B82F6" stroke-opacity="0.4" stroke-width="2" fill="none" stroke-linecap="square">
      <!-- Top-left -->
      <path d="M0 40 L0 16 Q0 0 16 0 L40 0" />
      <!-- Top-right -->
      <path d="M1160 0 L1184 0 Q1200 0 1200 16 L1200 40" />
      <!-- Bottom-left -->
      <path d="M0 240 L0 264 Q0 280 16 280 L40 280" />
      <!-- Bottom-right -->
      <path d="M1160 280 L1184 280 Q1200 280 1200 264 L1200 240" />
    </g>
  </g>
</svg>
