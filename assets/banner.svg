<svg width="1200" height="280" viewBox="0 0 1200 280" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="banner-title banner-desc">
  <title id="banner-title">Md Asif — AI Developer</title>
  <desc id="banner-desc">Profile banner: Minimal and professional design with identity text.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="280" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#050811"/>
      <stop offset="1" stop-color="#0B1120"/>
    </linearGradient>
    <clipPath id="bannerClip">
      <rect width="1200" height="280" rx="12"/>
    </clipPath>
  </defs>

  <g clip-path="url(#bannerClip)">
    <!-- Background -->
    <rect width="1200" height="280" fill="url(#bg)"/>

    <!-- Subtle accent line at top -->
    <rect x="0" y="0" width="1200" height="4" fill="#3B82F6" fill-opacity="0.8"/>

    <!-- Left side: Identity text block -->
    <g transform="translate(100, 0)">
      <!-- Eyebrow tag -->
      <text x="0" y="90" fill="#3B82F6" font-family="'Courier New', Consolas, monospace" font-size="13" font-weight="600" letter-spacing="3">AI DEVELOPER</text>

      <!-- Main name -->
      <text x="0" y="160" fill="#F8FAFC" font-family="system-ui, -apple-system, sans-serif" font-size="76" font-weight="800" letter-spacing="-1.5">Md Asif</text>

      <!-- Subtitle line -->
      <text x="4" y="200" fill="#94A3B8" font-family="system-ui, -apple-system, sans-serif" font-size="16" letter-spacing="0.5" font-weight="400">Building precise, intelligent systems and robust software architecture.</text>
    </g>

    <!-- Right side: Abstract subtle shapes -->
    <g opacity="0.4" transform="translate(850, 60)">
       <circle cx="150" cy="80" r="120" stroke="#1E293B" stroke-width="1" fill="none"/>
       <circle cx="150" cy="80" r="80" stroke="#1E293B" stroke-width="1" fill="none"/>
       <circle cx="150" cy="80" r="40" stroke="#1E293B" stroke-width="1" fill="none"/>
       <circle cx="150" cy="80" r="4" fill="#3B82F6"/>
       
       <line x1="30" y1="80" x2="270" y2="80" stroke="#1E293B" stroke-width="1" stroke-dasharray="4 4"/>
       <line x1="150" y1="-40" x2="150" y2="200" stroke="#1E293B" stroke-width="1" stroke-dasharray="4 4"/>
    </g>
    
    <!-- Outer Border -->
    <rect x="1" y="1" width="1198" height="278" rx="11" stroke="#1E293B" stroke-width="1.5" fill="none"/>
  </g>
</svg>
