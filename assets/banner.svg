<svg width="1200" height="280" viewBox="0 0 1200 280" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="banner-title banner-desc">
  <title id="banner-title">Md Asif — AI Automation Engineer</title>
  <desc id="banner-desc">Profile banner: dark precision grid with neural-network workflow visualization and identity text.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="280" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#060B18"/>
      <stop offset="1" stop-color="#0D1525"/>
    </linearGradient>
    <linearGradient id="mintFade" x1="700" y1="0" x2="1200" y2="280" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#00FFB2" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#00FFB2" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="nodeGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#00FFB2" stop-opacity="1"/>
      <stop offset="1" stop-color="#00FFB2" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="mintCore" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#00FFB2"/>
      <stop offset="100%" stop-color="#00C882"/>
    </radialGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softglow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <mask id="rightMask">
      <linearGradient id="maskGrad" x1="640" y1="0" x2="1200" y2="0" gradientUnits="userSpaceOnUse">
        <stop offset="0" stop-color="white" stop-opacity="0"/>
        <stop offset="0.3" stop-color="white" stop-opacity="1"/>
        <stop offset="1" stop-color="white" stop-opacity="1"/>
      </linearGradient>
      <rect width="1200" height="280" fill="url(#maskGrad)"/>
    </mask>
    <clipPath id="bannerClip">
      <rect width="1200" height="280" rx="16"/>
    </clipPath>
  </defs>

  <g clip-path="url(#bannerClip)">
    <!-- Background -->
    <rect width="1200" height="280" fill="url(#bg)"/>

    <!-- Subtle grid lines (left side) -->
    <g opacity="0.06" stroke="#00FFB2" stroke-width="1">
      <!-- Vertical grid -->
      <line x1="60" y1="0" x2="60" y2="280"/>
      <line x1="120" y1="0" x2="120" y2="280"/>
      <line x1="180" y1="0" x2="180" y2="280"/>
      <line x1="240" y1="0" x2="240" y2="280"/>
      <line x1="300" y1="0" x2="300" y2="280"/>
      <line x1="360" y1="0" x2="360" y2="280"/>
      <line x1="420" y1="0" x2="420" y2="280"/>
      <line x1="480" y1="0" x2="480" y2="280"/>
      <!-- Horizontal grid -->
      <line x1="0" y1="56" x2="600" y2="56"/>
      <line x1="0" y1="112" x2="600" y2="112"/>
      <line x1="0" y1="168" x2="600" y2="168"/>
      <line x1="0" y1="224" x2="600" y2="224"/>
    </g>

    <!-- Right panel: workflow graph visualization -->
    <!-- Node connections (edges) -->
    <g mask="url(#rightMask)" opacity="0.28" stroke="#00FFB2" stroke-width="1.5">
      <!-- Primary flow paths -->
      <path d="M680,80 Q720,60 760,90"/>
      <path d="M760,90 Q810,110 840,70"/>
      <path d="M840,70 Q880,40 920,80"/>
      <path d="M920,80 Q960,110 1000,75"/>
      <path d="M1000,75 Q1050,45 1090,90"/>
      <path d="M1090,90 Q1130,120 1160,85"/>
      <!-- Secondary flow paths -->
      <path d="M700,160 Q750,140 790,170"/>
      <path d="M790,170 Q840,195 870,155"/>
      <path d="M870,155 Q910,125 950,165"/>
      <path d="M950,165 Q990,190 1030,155"/>
      <path d="M1030,155 Q1075,120 1120,160"/>
      <path d="M1120,160 Q1155,185 1180,155"/>
      <!-- Cross connections -->
      <path d="M760,90 Q780,125 790,170" stroke-dasharray="4 6"/>
      <path d="M840,70 Q855,112 870,155" stroke-dasharray="4 6"/>
      <path d="M920,80 Q935,122 950,165" stroke-dasharray="4 6"/>
      <path d="M1000,75 Q1015,115 1030,155" stroke-dasharray="4 6"/>
      <path d="M1090,90 Q1105,125 1120,160" stroke-dasharray="4 6"/>
      <!-- Extra depth connections -->
      <path d="M700,215 Q760,200 820,220"/>
      <path d="M820,220 Q880,240 940,215"/>
      <path d="M940,215 Q1000,195 1060,218"/>
      <path d="M1060,218 Q1120,238 1170,210"/>
    </g>

    <!-- Animated pulse along main path -->
    <g opacity="0.7">
      <circle r="4" fill="#00FFB2" filter="url(#glow)">
        <animateMotion dur="4s" repeatCount="indefinite" path="M680,80 Q720,60 760,90 Q810,110 840,70 Q880,40 920,80 Q960,110 1000,75 Q1050,45 1090,90 Q1130,120 1160,85"/>
        <animate attributeName="opacity" values="0;1;1;0" dur="4s" repeatCount="indefinite"/>
      </circle>
      <circle r="4" fill="#00FFB2" filter="url(#glow)">
        <animateMotion dur="5s" begin="1.5s" repeatCount="indefinite" path="M700,160 Q750,140 790,170 Q840,195 870,155 Q910,125 950,165 Q990,190 1030,155 Q1075,120 1120,160 Q1155,185 1180,155"/>
        <animate attributeName="opacity" values="0;1;1;0" dur="5s" begin="1.5s" repeatCount="indefinite"/>
      </circle>
    </g>

    <!-- Network nodes (right side) -->
    <g filter="url(#glow)" mask="url(#rightMask)">
      <!-- Layer 1: top flow -->
      <circle cx="680" cy="80" r="5" fill="#00FFB2" opacity="0.9"/>
      <circle cx="760" cy="90" r="7" fill="#00FFB2" opacity="0.95"/>
      <circle cx="840" cy="70" r="5" fill="#00FFB2" opacity="0.85"/>
      <circle cx="920" cy="80" r="6" fill="#00FFB2" opacity="0.9"/>
      <circle cx="1000" cy="75" r="8" fill="#00FFB2" opacity="1"/>
      <circle cx="1090" cy="90" r="5" fill="#00FFB2" opacity="0.8"/>
      <circle cx="1160" cy="85" r="5" fill="#00FFB2" opacity="0.7"/>
      <!-- Layer 2: mid flow -->
      <circle cx="700" cy="160" r="5" fill="#00FFB2" opacity="0.7"/>
      <circle cx="790" cy="170" r="6" fill="#00FFB2" opacity="0.85"/>
      <circle cx="870" cy="155" r="8" fill="#00FFB2" opacity="0.9"/>
      <circle cx="950" cy="165" r="5" fill="#00FFB2" opacity="0.8"/>
      <circle cx="1030" cy="155" r="7" fill="#00FFB2" opacity="0.95"/>
      <circle cx="1120" cy="160" r="5" fill="#00FFB2" opacity="0.75"/>
      <circle cx="1180" cy="155" r="5" fill="#00FFB2" opacity="0.6"/>
      <!-- Layer 3: bottom flow -->
      <circle cx="700" cy="215" r="4" fill="#00FFB2" opacity="0.5"/>
      <circle cx="820" cy="220" r="5" fill="#00FFB2" opacity="0.6"/>
      <circle cx="940" cy="215" r="4" fill="#00FFB2" opacity="0.55"/>
      <circle cx="1060" cy="218" r="5" fill="#00FFB2" opacity="0.5"/>
      <circle cx="1170" cy="210" r="4" fill="#00FFB2" opacity="0.45"/>
    </g>

    <!-- Pulsing glow on key nodes -->
    <g>
      <circle cx="1000" cy="75" r="18" fill="#00FFB2" opacity="0.06">
        <animate attributeName="r" values="12;22;12" dur="3s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.06;0.12;0.06" dur="3s" repeatCount="indefinite"/>
      </circle>
      <circle cx="870" cy="155" r="16" fill="#00FFB2" opacity="0.06">
        <animate attributeName="r" values="10;20;10" dur="3.7s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.06;0.12;0.06" dur="3.7s" repeatCount="indefinite"/>
      </circle>
      <circle cx="1030" cy="155" r="16" fill="#00FFB2" opacity="0.06">
        <animate attributeName="r" values="11;21;11" dur="2.9s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.06;0.1;0.06" dur="2.9s" repeatCount="indefinite"/>
      </circle>
    </g>

    <!-- Left side: Identity text block -->
    <!-- Eyebrow tag -->
    <rect x="56" y="62" width="180" height="22" rx="4" fill="#00FFB2" fill-opacity="0.1" stroke="#00FFB2" stroke-opacity="0.35" stroke-width="1"/>
    <text x="68" y="77" fill="#00FFB2" font-family="'Courier New', Consolas, monospace" font-size="11" font-weight="600" letter-spacing="2.5">AI AUTOMATION ENG.</text>

    <!-- Main name -->
    <text x="56" y="148" fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="72" font-weight="800" letter-spacing="-2">Md Asif</text>

    <!-- Subtitle line -->
    <text x="58" y="176" fill="#8CA0BF" font-family="'Courier New', Consolas, monospace" font-size="14" letter-spacing="0.5">workflow automation · scalable apps · Azure AI</text>

    <!-- Horizontal rule -->
    <line x1="56" y1="196" x2="560" y2="196" stroke="#00FFB2" stroke-opacity="0.2" stroke-width="1"/>

    <!-- Bottom stat chips -->
    <g font-family="'Courier New', Consolas, monospace" font-size="11" fill="#8CA0BF">
      <!-- Python -->
      <rect x="56" y="210" width="72" height="20" rx="4" fill="#00FFB2" fill-opacity="0.06" stroke="#00FFB2" stroke-opacity="0.2" stroke-width="1"/>
      <text x="70" y="224" fill="#00FFB2">Python</text>
      <!-- PowerShell -->
      <rect x="136" y="210" width="84" height="20" rx="4" fill="#00FFB2" fill-opacity="0.06" stroke="#00FFB2" stroke-opacity="0.2" stroke-width="1"/>
      <text x="149" y="224" fill="#00FFB2">PowerShell</text>
      <!-- TypeScript -->
      <rect x="228" y="210" width="84" height="20" rx="4" fill="#00FFB2" fill-opacity="0.06" stroke="#00FFB2" stroke-opacity="0.2" stroke-width="1"/>
      <text x="241" y="224" fill="#00FFB2">TypeScript</text>
      <!-- Azure AI -->
      <rect x="320" y="210" width="70" height="20" rx="4" fill="#00FFB2" fill-opacity="0.06" stroke="#00FFB2" stroke-opacity="0.2" stroke-width="1"/>
      <text x="333" y="224" fill="#00FFB2">Azure AI</text>
    </g>

    <!-- Border -->
    <rect x="1" y="1" width="1198" height="278" rx="15" stroke="#00FFB2" stroke-opacity="0.18" stroke-width="1.5" fill="none"/>

    <!-- Top-left corner accent -->
    <path d="M0 40 L0 16 Q0 0 16 0 L40 0" stroke="#00FFB2" stroke-opacity="0.5" stroke-width="2" fill="none" stroke-linecap="square"/>
    <!-- Top-right corner accent -->
    <path d="M1160 0 L1184 0 Q1200 0 1200 16 L1200 40" stroke="#00FFB2" stroke-opacity="0.5" stroke-width="2" fill="none" stroke-linecap="square"/>
    <!-- Bottom-left corner accent -->
    <path d="M0 240 L0 264 Q0 280 16 280 L40 280" stroke="#00FFB2" stroke-opacity="0.5" stroke-width="2" fill="none" stroke-linecap="square"/>
    <!-- Bottom-right corner accent -->
    <path d="M1160 280 L1184 280 Q1200 280 1200 264 L1200 240" stroke="#00FFB2" stroke-opacity="0.5" stroke-width="2" fill="none" stroke-linecap="square"/>

    <!-- Scan line animation -->
    <rect x="56" y="0" width="1" height="280" fill="#00FFB2" opacity="0">
      <animate attributeName="x" values="56;1144;56" dur="8s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.08;0.12;0.08;0" keyTimes="0;0.1;0.5;0.9;1" dur="8s" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>
