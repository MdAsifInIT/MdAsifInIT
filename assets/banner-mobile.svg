<svg width="720" height="360" viewBox="0 0 720 360" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title description">
  <title id="title">Md Asif — AI Developer</title>
  <desc id="description">A compact command-center profile banner for small screens.</desc>

  <defs>
    <linearGradient id="background" x1="24" y1="16" x2="696" y2="344" gradientUnits="userSpaceOnUse">
      <stop stop-color="#070B14"/>
      <stop offset="1" stop-color="#0B1324"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#2563EB"/>
      <stop offset="1" stop-color="#60A5FA"/>
    </linearGradient>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0H0V28" stroke="#1E293B" stroke-width="1" opacity="0.22"/>
    </pattern>
    <clipPath id="frame">
      <rect width="720" height="360" rx="16"/>
    </clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="720" height="360" fill="url(#background)"/>
    <rect width="720" height="360" fill="url(#grid)"/>
    <rect width="5" height="360" fill="url(#accent)"/>

    <g transform="translate(48 52)">
      <text x="0" y="66" fill="#F8FAFC" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="64" font-weight="750" letter-spacing="-2">Md Asif</text>
      <text x="2" y="111" fill="#60A5FA" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="16" font-weight="600" letter-spacing="2.4">AI DEVELOPER</text>
      <text x="2" y="165" fill="#CBD5E1" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="18">Automation systems · Integration layers</text>
      <text x="2" y="195" fill="#94A3B8" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="18">Developer tooling · Bengaluru, India</text>
      <rect x="2" y="220" width="92" height="3" rx="1.5" fill="url(#accent)"/>
    </g>

    <g transform="translate(48 306)">
      <circle cx="6" cy="0" r="5" fill="#3B82F6"/>
      <circle cx="6" cy="0" r="10" stroke="#3B82F6" stroke-opacity="0.28"/>
      <text x="26" y="5" fill="#94A3B8" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="12" letter-spacing="1.2">BUILD · SHIP · HAND OFF</text>
    </g>
  </g>

  <rect x="1" y="1" width="718" height="358" rx="15" stroke="#263247" stroke-width="2"/>
</svg>
